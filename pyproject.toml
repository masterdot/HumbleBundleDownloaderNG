[project]
name = "hbdl"
version = "0.1.0"
description = "Download your Humble Bundle library (direct or BitTorrent)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "typer>=0.12",
    "tqdm>=4.66",
    "platformdirs>=4.2",
    "tenacity>=8.2",
    "playwright>=1.44",
]

[project.optional-dependencies]
torrent = ["libtorrent>=2.0"]
web = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
]
dev = ["pytest>=8.0", "pytest-mock>=3.14", "responses>=0.25", "httpx>=0.27"]

[project.scripts]
hbdl = "hbdl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hbdl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
