; Runs the virtual-display VNC login stack alongside the FastAPI app inside
; one container. See CONCEPT_WEB.md M13.
;
; xvfb    -- virtual X display :99, so Playwright's headless=False Chromium
;            (auth.guided_login(), unchanged) has something to render onto.
; x11vnc  -- exposes that display over VNC (port 5900, container-internal only).
; novnc   -- websockify serves the noVNC web client + proxies the VNC
;            connection over WebSockets on :6080, so the settings page can
;            embed it in a plain <iframe>, no VNC client software needed.
; hbdl-web -- the actual FastAPI app; DISPLAY=:99 is what makes
;            guided_login()'s browser render into the Xvfb framebuffer above.

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:xvfb]
command=Xvfb :99 -screen 0 1280x800x24 -nolisten tcp
priority=1
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:x11vnc]
command=x11vnc -display :99 -forever -shared -nopw -rfbport 5900 -noxdamage
priority=2
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:novnc]
command=websockify --web=/usr/share/novnc 6080 localhost:5900
priority=3
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:hbdl-web]
command=hbdl web serve --host 0.0.0.0 --port 8000
environment=DISPLAY=":99"
priority=4
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
